<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nos courses</title>
<meta name="theme-color" content="#2f7a46">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one narrow column built for a phone held in one hand in a supermarket aisle; add bar on top, list grouped by aisle, basket and staples below. */
:root {
  --bg: #f3f6f1;
  --card: #ffffff;
  --fg: #1d2a22;
  --muted: #5f6f64;
  --line: #d9e2da;
  --accent: #2f7a46;
  --accent-ink: #ffffff;
  --accent-soft: #e2f0e5;
  --warn: #b5432e;
  --green-soft: #eef7f0; --green-tag: #cfe9d6; --green-ink: #1f5c33;
  --blue-soft: #eef6fd; --blue-tag: #cfe6fa; --blue-ink: #1d5a87;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a15; --card: #1b261f; --fg: #e6efe8; --muted: #9db0a2; --line: #2c3b31;
    --accent: #6cc58a; --accent-ink: #0d1a11; --accent-soft: #213a2a; --warn: #f08a72;
    --green-soft: #1a2c21; --green-tag: #2a4a35; --green-ink: #a6e2b8; --blue-soft: #18252f; --blue-tag: #24405a; --blue-ink: #a9d6f5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a15; --card: #1b261f; --fg: #e6efe8; --muted: #9db0a2; --line: #2c3b31;
  --accent: #6cc58a; --accent-ink: #0d1a11; --accent-soft: #213a2a; --warn: #f08a72;
    --green-soft: #1a2c21; --green-tag: #2a4a35; --green-ink: #a6e2b8; --blue-soft: #18252f; --blue-tag: #24405a; --blue-ink: #a9d6f5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.4;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex; flex-direction: column; gap: 22px;
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: 1.9rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; }
h2 {
  font-family: var(--display); font-weight: 600; font-size: 0.8rem; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px;
}
.status { font-size: 0.9rem; color: var(--muted); }
.status.err { color: var(--warn); }

form.add { display: flex; gap: 8px; position: relative; }
form.add input {
  flex: 1; min-width: 0; font: inherit; padding: 14px 14px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--card); color: var(--fg);
}
form.add input:focus-visible { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
button { font: inherit; cursor: pointer; }
.btn {
  border: 0; border-radius: 12px; padding: 0 18px; background: var(--accent); color: var(--accent-ink);
  font-weight: 700; min-height: 48px;
}
.btn:focus-visible, .chip:focus-visible, .row button:focus-visible, .ghost:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.ghost {
  background: none; border: 1.5px solid var(--line); color: var(--fg); border-radius: 10px;
  padding: 10px 14px; font-weight: 700;
}
.suggest { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px dashed var(--line); background: transparent; color: var(--fg);
  border-radius: 999px; padding: 7px 12px; font-size: 0.95rem;
}
.chip b { color: var(--accent); }

.group { display: flex; flex-direction: column; }
ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
li.row { display: flex; align-items: center; gap: 4px; border-top: 1px solid var(--line); }
li.row:first-child { border-top: 0; }
.tick {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left;
  background: none; border: 0; color: var(--fg); padding: 14px 12px; min-height: 52px;
}
.box {
  flex: none; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--accent);
  display: grid; place-items: center;
}
.done .box { background: var(--accent); }
.done .box::after { content: ""; width: 10px; height: 6px; border: 2.5px solid var(--accent-ink); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.name { overflow-wrap: anywhere; }
.done .name { text-decoration: line-through; color: var(--muted); }
.tag { font-size: 0.75rem; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 6px; flex: none; }
.row .icon {
  flex: none; background: none; border: 0; color: var(--muted); width: 44px; height: 44px; border-radius: 10px;
  display: grid; place-items: center;
}
.row .icon[aria-pressed="true"] { color: var(--accent); }
.row .icon svg { width: 20px; height: 20px; }
.empty {
  background: var(--card); border: 1.5px dashed var(--line); border-radius: 14px; padding: 22px 18px; color: var(--muted);
}
.empty strong { color: var(--fg); display: block; margin-bottom: 4px; font-family: var(--display); font-size: 1.1rem; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.note { font-size: 0.85rem; color: var(--muted); margin: 6px 2px 0; }
@media (prefers-reduced-motion: no-preference) {
  li.row { transition: background 0.2s; }
}

.signin { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.signin p { margin: 0; color: var(--muted); max-width: 40ch; }
.who { font-size: 0.85rem; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 4px 0; text-decoration: underline; }
.by { margin-left: auto; flex: none; font-size: 0.78rem; font-weight: 700; color: var(--muted); border-radius: 999px; padding: 2px 9px; }
.p-green { background: var(--green-soft); }
.p-green .by { background: var(--green-tag); color: var(--green-ink); }
.p-blue { background: var(--blue-soft); }
.p-blue .by { background: var(--blue-tag); color: var(--blue-ink); }
#todo { display: flex; flex-direction: column; gap: 18px; }

:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Nos courses</h1>
    <span class="count" id="count"></span>
  </header>

  <section class="signin" id="signin" hidden>
    <p>Connectez-vous avec votre compte Google pour voir et modifier la liste commune.</p>
    <p class="note" id="ver">Version 15</p>
    <button class="btn" id="signinBtn" type="button">Se connecter avec Google</button>
  </section>

  <div id="status" class="status">Chargement…</div>

  <div id="main" hidden>
    <form class="add" id="addForm" autocomplete="off">
      <label for="newItem" hidden>Article à ajouter</label>
      <input id="newItem" name="newItem" placeholder="Ajouter un article, ex. lait" enterkeyhint="done" list="known">
      <datalist id="known"></datalist>
      <button class="btn" id="addBtn" type="submit">Ajouter</button>
    </form>

    <section id="suggestBox" hidden style="margin-top:22px">
      <h2>À racheter ?</h2>
      <div class="suggest" id="suggest"></div>
    </section>

    <section id="todo" style="margin-top:22px"></section>

    <section id="cartBox" hidden style="margin-top:22px">
      <h2>Déjà dans le panier</h2>
      <ul id="cart"></ul>
      <div class="actions">
        <button class="ghost" id="finish" type="button">Courses terminées</button>
      </div>
      <p class="note">« Courses terminées » vide le panier. Les essentiels (étoile) reviennent dans « À racheter ? ».</p>
    </section>

    <div class="who" style="margin-top:28px"><span id="who"></span><button class="linkbtn" id="signout" type="button">Se déconnecter</button></div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
